# Publishes the extension to the VS Code Marketplace without a stored token, using
# Marketplace Trusted Publishing (OIDC): GitHub issues a short-lived token for this
# workflow, and the Marketplace trusts it through the publisher's Trusted Publishing
# policy (repository tursoft/account-manager-for-claude, workflow publish.yml).
#
# Release: bump the version in package.json, commit, then push a matching tag:
#   git tag v1.2.3 && git push origin v1.2.3
# "Run workflow" (manual) builds and publishes the version in package.json on the chosen branch.
name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for Marketplace Trusted Publishing

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # The smoke tests are developed and run on Windows.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - run: npm run typecheck

      # One check ("the gap can be changed") is timing-sensitive and fails now and then; retry once.
      - name: Smoke tests
        run: npm run test:smoke || { echo "::warning::Smoke tests failed; retrying once"; npm run test:smoke; }

      - name: Build package
        run: npm run build:vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ steps.version.outputs.version }}
          path: account-manager-for-claude-${{ steps.version.outputs.version }}.vsix

      # --skip-duplicate makes a re-run after a later failure harmless.
      - name: Publish to the Marketplace
        run: npx vsce publish --oidc --skip-duplicate --packagePath "account-manager-for-claude-${{ steps.version.outputs.version }}.vsix"
